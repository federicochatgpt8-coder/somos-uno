<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Somos Uno</title>
  <meta name="theme-color" content="#073559">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Somos Uno">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

  <div id="loginBox" class="login-box">
    <div class="login-card">
      <img class="login-logo" src="icons/logo-azul.png" alt="Somos Uno">
      <p class="login-sub">Gestión de pedidos</p>
      <div class="login-linea"></div>
      <div id="botonGoogle" class="login-google"></div>
      <p id="loginError" class="login-msg">Cargando…</p>
      <p class="login-ayuda">Ingresá con la cuenta de Google que tenés registrada en Somos Uno.</p>
    </div>
  </div>

  <div class="app oculto" id="appPrincipal">

    <header class="topbar">
      <div class="topbar-titulo">
        <img class="topbar-logo" src="icons/isotipo-blanco.png" alt="">
        <div>
        <h1>Somos Uno</h1>
        <p id="usuario">Cargando usuario...</p>
        </div>
      </div>

      <div class="menu-transportista" id="menuTransportista"></div>

      <div class="topbar-acciones">
        <button onclick="cargarApp()" title="Actualizar">↻ Actualizar</button>
        <button onclick="cerrarSesion()" class="btn-salir">Salir</button>
      </div>
    </header>

    <section id="dashboard" class="dashboard"></section>

    <section class="section-title">
      <h2>Operación</h2>
    </section>

    <section id="kanban" class="kanban"></section>

  </div>

  <div id="detallePedido" class="panel-detalle oculto"></div>

  <input
    type="file"
    id="inputAdjuntoPedido"
    style="display:none"
    onchange="procesarArchivoAdjunto(this)"
  >

  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mejoras.js"></script>
  <script src="js/metricas.js"></script>
  <script src="js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
